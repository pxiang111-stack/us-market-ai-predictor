name: Binance Snapshot DeepSeek Committee

on:
  workflow_dispatch:
  push:
    paths:
      - 'gemini_committee/binance_snapshot_input.json'

permissions:
  contents: write

concurrency:
  group: binance-snapshot-committee
  cancel-in-progress: false

jobs:
  judge-binance-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gemini_committee/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r gemini_committee/requirements.txt
      - name: Validate committee script
        run: python -m py_compile gemini_committee/binance_snapshot_committee.py
      - name: Ask DeepSeek committee to judge Binance data
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python gemini_committee/binance_snapshot_committee.py
      - name: Commit Binance committee report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini_committee/binance_snapshot_report.json gemini_committee/binance_snapshot_report.md
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Add DeepSeek judgment of Binance multi-timeframe snapshot"
            git push
          fi
