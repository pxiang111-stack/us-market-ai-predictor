name: Binance Spot Live DeepSeek Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'gemini_committee/trigger.txt'
      - 'gemini_committee/binance_spot_config.json'
      - 'gemini_committee/binance_snapshot_committee.py'

permissions:
  contents: write

concurrency:
  group: binance-spot-deepseek-analysis
  cancel-in-progress: false

jobs:
  live-market-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r gemini_committee/requirements.txt
      - name: Validate script
        run: python -m py_compile gemini_committee/binance_snapshot_committee.py
      - name: Fetch Binance public spot data and ask DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python gemini_committee/binance_snapshot_committee.py
      - name: Commit analysis report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini_committee/binance_snapshot_report.json gemini_committee/binance_snapshot_report.md
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Publish Binance spot live DeepSeek analysis"
            git push
          fi
