name: V8 QQQ Trend Breakout Research
on:
  workflow_dispatch:
  push:
    branches:
      - assistant-v8-qqq-trend-breakout
    paths:
      - 'qqq_v8_trend_breakout.py'
      - '.github/workflows/qqq_v8_trend_breakout.yml'
permissions:
  contents: read
jobs:
  qqq-trend-breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Compile research script
        run: python -m compileall -q qqq_v8_trend_breakout.py
      - name: Run QQQ strategy comparison
        run: python qqq_v8_trend_breakout.py
      - name: Upload V8 reports
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v8-trend-breakout
          path: output/qqq_v8_trend_breakout/
          if-no-files-found: error
          retention-days: 30
