name: Three-Year QQQ Strategy Lab

on:
  workflow_dispatch:
  push:
    branches:
      - assistant-v11-raw-price-dividends
    paths:
      - 'strategy_lab_v1.py'
      - 'tests/test_strategy_lab_v1.py'
      - '.github/workflows/strategy_lab.yml'

permissions:
  contents: read

jobs:
  strategy-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Compile and test strategy lab
        run: |
          python -m py_compile strategy_lab_v1.py
          python -m unittest discover -s tests -p 'test_strategy_lab_v1.py' -v
      - name: Run latest-three-year $10,000 cash-account comparison
        run: python strategy_lab_v1.py
      - name: Upload three-year results
        uses: actions/upload-artifact@v4
        with:
          name: three-year-qqq-strategy-lab
          path: output/strategy_lab_v1/
          if-no-files-found: error
          retention-days: 14
