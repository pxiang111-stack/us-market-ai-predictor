name: Gemini Committee Direct Smoke Test

on:
  push:
    branches:
      - premarket-gemini-committee-v1
    paths:
      - .github/workflows/gemini_smoke_test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Verify Gemini key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing or empty"
            exit 1
          fi
          echo "Gemini API key is present (value is not displayed)."

      - name: Directly test five-seat Gemini committee response
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python - <<'PY'
          import json, os, requests
          from requests.exceptions import RequestException
          model = (os.getenv("GEMINI_MODEL") or "").strip() or "gemini-3.6-flash"
          key = os.environ["GEMINI_API_KEY"]
          headers = {"Content-Type": "application/json", "x-goog-api-key": key}
          base = "https://generativelanguage.googleapis.com/v1beta"
          # First distinguish model/key access from generation latency.
          try:
              meta = requests.get(f"{base}/models/{model}", headers={"x-goog-api-key": key}, timeout=(10, 25))
          except RequestException as exc:
              raise SystemExit(f"Gemini model metadata request failed: {type(exc).__name__}: {exc}")
          if meta.status_code != 200:
              detail = meta.text[:1200].replace(key, "[REDACTED]")
              raise SystemExit(f"Gemini model metadata HTTP {meta.status_code}: {detail}")
          prompt = """请用中文按以下六个标题逐项回答，每项至少一句完整内容：\n## 1. 量化筛选\n## 2. 市场环境\n## 3. 新闻与基本面\n## 4. AI资本开支风险\n## 5. 风控\n## 6. 委员会结论\n说明这是同一个Gemini模型模拟五种视角，不是五个独立模型。没有实时数据，不得编造行情。"""
          body = {
              "contents":[{"role":"user","parts":[{"text":prompt}]}],
              "generationConfig":{
                  "maxOutputTokens":2048,
                  "thinkingConfig":{"thinkingLevel":"low"}
              }
          }
          try:
              response = requests.post(
                  f"{base}/models/{model}:generateContent",
                  headers=headers, json=body, timeout=(10, 180)
              )
          except RequestException as exc:
              raise SystemExit(f"Gemini generateContent request failed: {type(exc).__name__}: {exc}")
          if response.status_code != 200:
              detail = response.text[:1500].replace(os.environ["GEMINI_API_KEY"], "[REDACTED]")
              raise SystemExit(f"Gemini API HTTP {response.status_code}: {detail}")
          payload = response.json()
          parts = payload.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          answer = "\n".join(p.get("text","") for p in parts if p.get("text")).strip()
          if not answer:
              raise SystemExit("Gemini API returned no text content: " + json.dumps(payload.get("promptFeedback",{}), ensure_ascii=False))
          candidate = payload.get("candidates", [{}])[0]
          finish_reason = candidate.get("finishReason", "unknown")
          if len(answer) < 120:
              raise SystemExit(
                  f"Gemini returned too little text ({len(answer)} chars); "
                  f"finishReason={finish_reason}; response={answer[:1200]}"
              )
          os.makedirs("gemini-smoke-output", exist_ok=True)
          with open("gemini-smoke-output/gemini_committee_smoke_test.md","w",encoding="utf-8") as f:
              f.write("# Gemini 委员会直连测试\n\n")
              f.write(f"- 模型：{model}\n- API：generateContent\n- 结果：成功\n- 说明：这是连接与五席结构测试，不是完整盘前研究报告。\n\n")
              f.write(answer + "\n")
          print(json.dumps({"status":"success","model":model,"finish_reason":finish_reason,"response_chars":len(answer),"output":"gemini-smoke-output/gemini_committee_smoke_test.md"}, ensure_ascii=False))
          PY

      - name: Upload Gemini smoke test report
        uses: actions/upload-artifact@v4
        with:
          name: gemini-committee-smoke-test
          path: gemini-smoke-output/gemini_committee_smoke_test.md
          if-no-files-found: error
