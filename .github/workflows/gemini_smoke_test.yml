name: Gemini Committee Direct Smoke Test

on:
  push:
    branches:
      - premarket-gemini-committee-v1
    paths:
      - .github/workflows/gemini_smoke_test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Verify Gemini key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing or empty"
            exit 1
          fi
          echo "Gemini API key is present (value is not displayed)."

      - name: Directly test five-seat Gemini committee response
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python - <<'PY'
          import json, os, requests
          model = (os.getenv("GEMINI_MODEL") or "").strip() or "gemini-3.8-flash"
          prompt = """你是美股盘前风险审查委员会。请用中文分别以五个席位给出简短意见：1量化筛选，2市场环境，3新闻与基本面，4AI资本开支与融资风险，5风控。然后给出委员会总判断。明确说明这是单个Gemini模型模拟五个视角，不是五个独立模型。不得编造实时行情或新闻。请使用以下测试数据：QQQ测试标记，NQ测试标记，SOXL测试标记。输出必须包含五个席位标题和“委员会结论”。"""
          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
          response = requests.post(
              url,
              headers={"Content-Type": "application/json", "x-goog-api-key": os.environ["GEMINI_API_KEY"]},
              json={"contents":[{"role":"user","parts":[{"text":prompt}]}],
                    "generationConfig":{"maxOutputTokens":1800}},
              timeout=90,
          )
          if response.status_code != 200:
              detail = response.text[:1500].replace(os.environ["GEMINI_API_KEY"], "[REDACTED]")
              raise SystemExit(f"Gemini API HTTP {response.status_code}: {detail}")
          payload = response.json()
          parts = payload.get("candidates", [{}])[0].get("content", {}).get("parts", [])
          answer = "\n".join(p.get("text","") for p in parts if p.get("text")).strip()
          if not answer:
              raise SystemExit("Gemini API returned no text content: " + json.dumps(payload.get("promptFeedback",{}), ensure_ascii=False))
          required = ["量化", "市场", "新闻", "资本开支", "风控", "委员会结论"]
          missing = [term for term in required if term not in answer]
          if missing:
              raise SystemExit("Gemini responded, but committee structure is incomplete; missing: " + ", ".join(missing) + "\n" + answer[:2500])
          os.makedirs("gemini-smoke-output", exist_ok=True)
          with open("gemini-smoke-output/gemini_committee_smoke_test.md","w",encoding="utf-8") as f:
              f.write("# Gemini 委员会直连测试\n\n")
              f.write(f"- 模型：{model}\n- API：generateContent\n- 结果：成功\n- 说明：这是连接与五席结构测试，不是完整盘前研究报告。\n\n")
              f.write(answer + "\n")
          print(json.dumps({"status":"success","model":model,"committee_sections":"all five seats + conclusion","output":"gemini-smoke-output/gemini_committee_smoke_test.md"}, ensure_ascii=False))
          PY

      - name: Upload Gemini smoke test report
        uses: actions/upload-artifact@v4
        with:
          name: gemini-committee-smoke-test
          path: gemini-smoke-output/gemini_committee_smoke_test.md
          if-no-files-found: error
