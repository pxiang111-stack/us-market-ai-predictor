name: Market Source Probe (isolated diagnostic)

on:
  workflow_dispatch:
  push:
    paths:
      - 'gemini_committee/probe_trigger.txt'
      - 'gemini_committee/test_market_sources.py'
      - '.github/workflows/market_source_probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Run source diagnostic
        run: python gemini_committee/test_market_sources.py
      - name: Commit diagnostic reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini_committee/source_probe.json gemini_committee/source_probe.md
          if git diff --cached --quiet; then echo "No report changes."; else git commit -m "Update market source probe report"; git push; fi
