name: BTC DeepSeek Independent Snapshot

on:
  push:
    paths:
      - 'gemini_committee/btc_snapshot_input.json'
      - 'gemini_committee/btc_snapshot_committee.py'
      - '.github/workflows/btc_deepseek_snapshot.yml'

permissions:
  contents: write

concurrency:
  group: btc-deepseek-snapshot
  cancel-in-progress: false

jobs:
  btc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r gemini_committee/requirements.txt
      - name: Validate BTC analysis script
        run: python -m py_compile gemini_committee/btc_snapshot_committee.py
      - name: Ask DeepSeek to independently analyze BTC
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python gemini_committee/btc_snapshot_committee.py
      - name: Commit BTC report and locked forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add gemini_committee/btc_deepseek_report.json gemini_committee/btc_deepseek_report.md gemini_committee/btc_forecast_ledger.json
          if git diff --cached --quiet; then
            echo "No BTC report or forecast changes."
          else
            git commit -m "Publish BTC DeepSeek forecast and lock prediction"
            git push
          fi
