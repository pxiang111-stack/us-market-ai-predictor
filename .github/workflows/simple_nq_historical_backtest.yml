name: Simple NQ Trader V1 historical QQQ backtest

on:
  workflow_dispatch:
  push:
    branches:
      - "simple-nq-trader-v1"
    paths:
      - "simple_nq_backtest.py"
      - "download_qqq_history.py"
      - "simple_nq_*.py"
      - "tests/test_simple_nq_*.py"
      - ".github/workflows/simple_nq_historical_backtest.yml"
  pull_request:
    paths:
      - "simple_nq_backtest.py"
      - "download_qqq_history.py"
      - "simple_nq_*.py"
      - "tests/test_simple_nq_*.py"
      - ".github/workflows/simple_nq_historical_backtest.yml"

permissions:
  contents: read

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install data dependencies
        run: python -m pip install --upgrade pip pandas yfinance
      - name: Run V1 unit tests
        run: python -m unittest discover -s tests -p "test_simple_nq_*.py" -v
      - name: Download split-adjusted QQQ execution OHLC and actions
        run: python download_qqq_history.py --start 2010-01-01 --output data/QQQ_daily_execution.csv
      - name: Run $10,000 historical backtest
        run: python simple_nq_backtest.py --csv data/QQQ_daily_execution.csv --capital 10000 --commission-bps 1 --slippage-bps 5 --output-dir output
      - name: Run fixed chronological walk-forward diagnostics
        run: python simple_nq_walkforward.py --csv data/QQQ_daily_execution.csv --capital 10000 --commission-bps 1 --slippage-bps 5 --output-dir output
      - name: Display backtest summary
        run: |
          cat output/simple_nq_backtest_summary.json
          cat output/simple_nq_walkforward_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: simple-nq-qqq-corporate-action-backtest
          path: |
            output/simple_nq_backtest_summary.json
            output/simple_nq_backtest_trades.csv
            output/simple_nq_walkforward_summary.json
            output/simple_nq_walkforward_trades.csv
            data/QQQ_daily_execution.csv
          retention-days: 14
