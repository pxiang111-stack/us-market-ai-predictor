name: Market Structure Unit Tests
on:
  push:
    branches: [assistant-v5-market-structure]
    paths:
      - 'market_structure_v5.py'
      - 'market_risk_v4.py'
      - 'walkforward_forecast_v5.py'
      - 'trade_decision_v5.py'
      - 'tests/**'
      - 'tests/test_market_structure_v5.py'
      - '.github/workflows/market_structure_tests.yml'
  pull_request:
    paths:
      - 'market_structure_v5.py'
      - 'tests/test_market_structure_v5.py'
      - '.github/workflows/market_structure_tests.yml'
permissions:
  contents: read
jobs:
  test-market-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python -m compileall -q market_structure_v5.py tests/test_market_structure_v5.py
      - run: python -m unittest discover -s tests -p 'test_market_structure_v5.py' -v
