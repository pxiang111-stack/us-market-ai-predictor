name: V5 Purged Walk-Forward Backtest
on:
  pull_request:
    paths:
      - 'trigger_walkforward_backtest.txt'
      - 'qqq_drawdown_risk_v1.py'
      - 'frequency_sweep_v2.py'
      - 'walkforward_execution_v5.py'
      - 'tests/test_qqq_drawdown_risk_v1.py'
      - 'tests/test_walkforward_execution_v5.py'
      - '.github/workflows/walkforward_backtest_v5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v5-walkforward-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy yfinance scikit-learn requests tabulate
      - name: Compile and test
        run: |
          python -m compileall -q market_risk_v4.py market_structure_v5.py trade_decision_v5.py walkforward_forecast_v5.py walkforward_execution_v5.py qqq_drawdown_diagnostics_v1.py walkforward_backtest_v5.py frequency_sweep_v1.py frequency_sweep_v2.py qqq_drawdown_risk_v1.py tests
          python -m unittest discover -s tests -v
      - name: Run purged walk-forward backtest
        run: python walkforward_backtest_v5.py
      - name: Run QQQ trade-frequency sensitivity experiment
        run: python frequency_sweep_v1.py
      - name: Run cost-aware QQQ frequency and execution diagnostics
        run: python frequency_sweep_v2.py
      - name: Run dedicated QQQ downside-risk walk-forward model
        run: python qqq_drawdown_risk_v1.py
      - name: Upload OOS forecasts, trades and equity curves
        uses: actions/upload-artifact@v4
        with:
          name: v5-walkforward-backtest
          path: |
            output/walkforward_v5/
            output/frequency_sweep_v1/
            output/frequency_sweep_v2/
            output/qqq_drawdown_risk_v1/
          if-no-files-found: error
          retention-days: 30
