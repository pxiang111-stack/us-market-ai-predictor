name: V9 QQQ Regime and Cost Robustness
on:
  workflow_dispatch:
  push:
    branches:
      - assistant-v9-regime-cost-robustness
    paths:
      - 'qqq_v9_robustness.py'
      - 'qqq_v8_trend_breakout.py'
      - '.github/workflows/qqq_v9_robustness.yml'
permissions:
  contents: read
jobs:
  robustness-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Compile scripts
        run: python -m compileall -q qqq_v8_trend_breakout.py qqq_v9_robustness.py
      - name: Run robustness audit
        run: python qqq_v9_robustness.py
      - name: Upload V9 reports
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v9-robustness
          path: output/qqq_v9_robustness/
          if-no-files-found: error
          retention-days: 30
