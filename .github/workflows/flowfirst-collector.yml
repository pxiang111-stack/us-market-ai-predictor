name: FlowFirst Data Collector

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flowfirst-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependency
        run: python -m pip install --upgrade requests

      - name: Compile FlowFirst modules
        run: python -m py_compile flowfirst_collector.py flowfirst_validate.py flowfirst_signal.py flowfirst_backtest.py

      - name: Run FlowFirst unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect Binance TradFi market data
        if: github.event_name == 'workflow_dispatch'
        run: python flowfirst_collector.py

      - name: Validate accumulated raw data
        run: python flowfirst_validate.py

      - name: Generate FlowFirst research signals
        run: python flowfirst_signal.py

      - name: Run FlowFirst strategy comparison backtest
        run: python flowfirst_backtest.py

      - name: Commit newly collected data and signal report
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flowfirst/*.jsonl reports/flowfirst_latest.json reports/flowfirst_latest.md reports/flowfirst_backtest.json reports/flowfirst_backtest.md
          if git diff --cached --quiet; then
            echo "No new records to commit."
          else
            git commit -m "chore(flowfirst): append market data"
            git push
          fi

      - name: Upload FlowFirst research reports
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: flowfirst-research-reports
          path: |
            reports/flowfirst_latest.json
            reports/flowfirst_latest.md
            reports/flowfirst_backtest.json
            reports/flowfirst_backtest.md
          if-no-files-found: ignore
