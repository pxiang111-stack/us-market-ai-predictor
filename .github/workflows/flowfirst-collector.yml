name: FlowFirst Data Collector

on:
  workflow_dispatch:
  schedule:
    # 15-minute collection cadence during the broad US trading window (UTC).
    # GitHub may delay scheduled workflows; this is not a guaranteed real-time feed.
    - cron: "*/15 12-22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: flowfirst-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install collector dependency
        run: python -m pip install --upgrade requests

      - name: Collect Binance TradFi market data
        run: python flowfirst_collector.py

      - name: Commit newly collected raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flowfirst/*.jsonl
          if git diff --cached --quiet; then
            echo "No new records to commit."
          else
            git commit -m "chore(flowfirst): append market data"
            git push
          fi
