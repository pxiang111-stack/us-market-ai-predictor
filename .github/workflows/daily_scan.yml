name: Daily US Market AI Scan

on:
  push:
    branches: [main, assistant-v4-research, premarket-gemini-committee-v1]
    paths:
      - 'us_market_ai_v3_1_news.py'
      - 'quant_research.py'
      - 'market_risk_v4.py'
      - 'gemini_committee.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/daily_scan.yml'
  workflow_dispatch:
  schedule:
    # 12:30 UTC is 07:30 New York in standard time / 08:30 in daylight time.
    # Runs before the US cash-session open; GitHub may delay scheduled jobs.
    - cron: "30 12 * * 1-5"

concurrency:
  group: daily-us-market-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # Repository secrets are read when a run is queued; start a new run after changing them.
      - name: Verify Gemini API key secret is present
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Repository secret GEMINI_API_KEY is missing or empty."
            exit 1
          fi
      - name: Compile and test research modules
        run: |
          python -m compileall -q us_market_ai_v3_1_news.py quant_research.py market_risk_v4.py gemini_committee.py tests
          python -m unittest discover -s tests -v
      - name: Run V3.1 cross-sectional opportunity model
        run: python us_market_ai_v3_1_news.py --period 10y --max-symbols 1200
      - name: Run V4 NQ, SOXL and AI risk model
        run: python market_risk_v4.py
      - name: Run Gemini premarket committee review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python gemini_committee.py
      - name: Upload prediction and committee reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-predictions
          path: output/
          if-no-files-found: error
          retention-days: 30
