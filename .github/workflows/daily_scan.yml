name: Daily US Market AI Scan

on:
  schedule:
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI stock prediction
        run: python us_market_ai_v2.py
      - name: Upload prediction results
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-predictions
          path: output/
          if-no-files-found: warn
