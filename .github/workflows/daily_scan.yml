
name: Daily US Market AI Scan
on:
  push:
    branches: [main, assistant-v4-research, assistant-v11-raw-price-dividends]
    paths:
      - 'us_market_ai_v3.py'
      - 'us_market_ai_v3_1_news.py'
      - 'quant_research.py'
      - 'market_risk_v4.py'
      - 'walkforward_backtest_v5.py'
      - 'strategy_lab_v1.py'
      - 'walkforward_forecast_v5.py'
      - 'walkforward_execution_v5.py'
      - 'trade_decision_v5.py'
      - 'market_structure_v5.py'
      - 'qqq_drawdown_diagnostics_v1.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/daily_scan.yml'
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
concurrency:
  group: daily-us-market-scan-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile and test research modules
        run: |
          python -m compileall -q us_market_ai_v3_1_news.py quant_research.py market_risk_v4.py walkforward_backtest_v5.py walkforward_forecast_v5.py walkforward_execution_v5.py trade_decision_v5.py strategy_lab_v1.py market_structure_v5.py qqq_drawdown_diagnostics_v1.py tests
          python -m unittest discover -s tests -v
      - name: Run cash-only whole-share QQQ strategy lab
        run: python strategy_lab_v1.py
      - name: Run V3.1 cross-sectional opportunity model
        run: python us_market_ai_v3_1_news.py
      - name: Run V4 NQ, SOXL and AI risk model
        run: python market_risk_v4.py
      - name: Run $10,000 walk-forward strategy backtest
        run: python walkforward_backtest_v5.py
      - name: Upload prediction reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-predictions
          path: output/
          if-no-files-found: error
          retention-days: 30
