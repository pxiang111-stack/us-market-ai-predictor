
name: Daily US Market AI Scan

on:
  push:
    branches: [main]
    paths:
      - 'us_market_ai_v3.py'
      - 'us_market_ai_v3_1_news.py'
      - 'quant_research.py'
      - 'requirements.txt'
      - '.github/workflows/daily_scan.yml'
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"

concurrency:
  group: daily-us-market-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V4 factor and ML research model
        run: |
          python us_market_ai_v3_1_news.py

      - name: Upload prediction reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-market-predictions
          path: output/
          if-no-files-found: error
          retention-days: 30
