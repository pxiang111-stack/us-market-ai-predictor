name: V5 Daily Market Structure Scan
on:
  push:
    branches: [assistant-v5-market-structure]
    paths:
      - 'market_structure_v5.py'
      - 'run_market_structure_v5.py'
      - 'tests/test_market_structure_v5.py'
      - '.github/workflows/market_structure_v5.yml'
  pull_request:
    paths:
      - 'market_structure_v5.py'
      - 'run_market_structure_v5.py'
      - 'tests/test_market_structure_v5.py'
      - '.github/workflows/market_structure_v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas numpy yfinance
      - run: python -m compileall -q market_structure_v5.py run_market_structure_v5.py tests
      - run: python -m unittest discover -s tests -p 'test_market_structure_v5.py' -v
      - name: Run live daily OHLCV scan
        if: github.event_name != 'pull_request'
        run: python run_market_structure_v5.py
      - name: Upload market structure reports
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: market-structure-v5
          path: output/market_structure_*_v5.*
          if-no-files-found: error
          retention-days: 30
