name: V10 QQQ $10K Cash Account Backtest
on:
  workflow_dispatch:
  push:
    branches:
      - assistant-v10-10k-cash-account
    paths:
      - 'qqq_v10_10k_cash_account.py'
      - 'qqq_v8_trend_breakout.py'
      - '.github/workflows/qqq_v10_10k_cash_account.yml'
permissions:
  contents: read
jobs:
  cash-account-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Compile scripts
        run: python -m compileall -q qqq_v8_trend_breakout.py qqq_v10_10k_cash_account.py
      - name: Run $10,000 cash-account simulation
        run: python qqq_v10_10k_cash_account.py
      - name: Upload V10 account reports
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v10-10k-cash-account
          path: output/qqq_v10_10k_cash_account/
          if-no-files-found: error
          retention-days: 30
