name: V7 QQQ Matched Risk Overlay
on:
  workflow_dispatch:
  push:
    branches:
      - assistant-v7-matched-risk-overlay
    paths:
      - 'qqq_matched_risk_overlay_v1.py'
      - 'qqq_drawdown_risk_v1.py'
      - 'market_risk_v4.py'
      - '.github/workflows/qqq_matched_risk_overlay_v1.yml'
permissions:
  contents: read
jobs:
  matched-risk-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance scikit-learn requests tabulate
      - name: Compile and test
        run: |
          python -m compileall -q market_risk_v4.py qqq_drawdown_risk_v1.py qqq_matched_risk_overlay_v1.py
          python -m unittest discover -s tests -v
      - name: Run matched-window risk overlay
        run: python qqq_matched_risk_overlay_v1.py
      - name: Upload matched-window reports
        uses: actions/upload-artifact@v4
        with:
          name: qqq-matched-risk-overlay-v1
          path: output/qqq_matched_risk_overlay_v1/
          if-no-files-found: error
          retention-days: 30
