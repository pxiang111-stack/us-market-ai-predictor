name: DeepSeek Quant Committee (Free IEX)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 12-22 * * 1-5'
  push:
    paths:
      - 'gemini_committee/trigger.txt'

permissions:
  contents: write

jobs:
  run-deepseek-committee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gemini_committee/requirements.txt
      - name: Install committee-only dependencies
        run: python -m pip install -r gemini_committee/requirements.txt
      - name: Validate free Alpaca IEX credentials
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ -z "$APCA_API_KEY_ID" ] || [ -z "$APCA_API_SECRET_KEY" ]; then
            echo "::error::Configure APCA_API_KEY_ID and APCA_API_SECRET_KEY in GitHub Actions Secrets (Alpaca Basic is free)."
            exit 1
          fi
          echo "Alpaca API credentials are present (values are not displayed)."
      - name: Monitor free IEX quotes and run committee only on triggers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python gemini_committee/intraday_monitor.py
      - name: Commit committee reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add gemini_committee/daily_report.json gemini_committee/daily_report.md gemini_committee/intraday_snapshot.json
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Update DeepSeek Quant Committee report (free IEX)"
            git push
          fi
