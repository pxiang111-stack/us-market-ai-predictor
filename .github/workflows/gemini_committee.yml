name: DeepSeek Quant Committee (Tiger OpenAPI)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 12-22 * * 1-5'
  push:
    paths:
      - 'gemini_committee/trigger.txt'

permissions:
  contents: write

jobs:
  run-deepseek-committee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: gemini_committee/requirements.txt
      - name: Install committee-only dependencies
        run: python -m pip install -r gemini_committee/requirements.txt
      - name: Compile committee Python modules
        run: python -m compileall -q gemini_committee
      - name: Configure Tiger OpenAPI credentials
        env:
          TIGER_OPENAPI_CONFIG: ${{ secrets.TIGER_OPENAPI_CONFIG }}
        run: |
          if [ -z "$TIGER_OPENAPI_CONFIG" ]; then
            echo "::error::GitHub Actions Secret TIGER_OPENAPI_CONFIG is missing."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tiger"
          printf '%s' "$TIGER_OPENAPI_CONFIG" > "$RUNNER_TEMP/tiger/tiger_openapi_config.properties"
          chmod 600 "$RUNNER_TEMP/tiger/tiger_openapi_config.properties"
          echo "TIGER_CONFIG_DIR=$RUNNER_TEMP/tiger" >> "$GITHUB_ENV"
          echo "Tiger OpenAPI configuration is present (values hidden)."
      - name: Diagnose Tiger config fields (never print values)
        env:
          TIGER_OPENAPI_CONFIG: ${{ secrets.TIGER_OPENAPI_CONFIG }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from jproperties import Properties
          p=Properties()
          p.load(os.environ["TIGER_OPENAPI_CONFIG"].encode("utf-8"), "utf-8")
          print("Tiger config keys:", ", ".join(sorted(p.keys())))
          for key in ("tiger_id", "account", "license", "private_key", "private_key_pk1", "private_key_pk8"):
              item=p.get(key)
              value=getattr(item, "data", "") if item else ""
              print(f"{key}: {'present' if value else 'MISSING'}; length={len(value or '')}")
          PY
      - name: Test Tiger market data and run committee
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python gemini_committee/intraday_monitor.py
      - name: Commit committee reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini_committee/daily_report.json gemini_committee/daily_report.md gemini_committee/intraday_snapshot.json
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Update DeepSeek Quant Committee report (Tiger OpenAPI)"
            git push
          fi
