name: V11 QQQ $10K Raw Price + Dividend Cash Backtest
on:
  workflow_dispatch:
  push:
    branches:
      - assistant-v11-raw-price-dividends
    paths:
      - 'qqq_v11_raw_price_dividends.py'
      - 'qqq_v8_trend_breakout.py'
      - '.github/workflows/qqq_v11_raw_price_dividends.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Compile
        run: python -m compileall -q qqq_v8_trend_breakout.py qqq_v11_raw_price_dividends.py
      - name: Run raw-price cash account backtest
        run: python qqq_v11_raw_price_dividends.py
      - name: Upload V11 reports
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v11-raw-price-dividends
          path: output/qqq_v11_raw_price_dividends/
          if-no-files-found: error
          retention-days: 30
