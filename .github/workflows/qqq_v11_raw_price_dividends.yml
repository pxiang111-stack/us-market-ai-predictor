name: V11-V14 QQQ Cash Account Research Backtests
on:
  workflow_dispatch:
  push:
    branches:
      - assistant-v11-raw-price-dividends
    paths:
      - 'qqq_v11_raw_price_dividends.py'
      - 'qqq_v8_trend_breakout.py'
      - 'qqq_v12_short_horizon.py'
      - 'qqq_v13_robustness_audit.py'
      - 'qqq_v14_portfolio.py'
      - '.github/workflows/qqq_v11_raw_price_dividends.yml'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy yfinance
      - name: Compile
        run: python -m compileall -q qqq_v8_trend_breakout.py qqq_v11_raw_price_dividends.py qqq_v12_short_horizon.py qqq_v13_robustness_audit.py qqq_v14_portfolio.py
      - name: Run raw-price cash account backtest
        run: python qqq_v11_raw_price_dividends.py
      - name: Run V12 short-horizon cash-account experiments
        run: python qqq_v12_short_horizon.py
      - name: Run V13 cost and regime robustness audit
        run: python qqq_v13_robustness_audit.py
      - name: Run V14 trend-core tactical portfolio tests
        run: python qqq_v14_portfolio.py
      - name: Upload V11, V12, V13 and V14 reports
        uses: actions/upload-artifact@v4
        with:
          name: qqq-v11-raw-price-dividends
          path: |
            output/qqq_v11_raw_price_dividends/
            output/qqq_v12_short_horizon/
            output/qqq_v13_robustness/
            output/qqq_v14_portfolio/
          if-no-files-found: error
          retention-days: 30
