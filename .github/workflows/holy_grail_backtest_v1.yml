name: Linda Raschke Holy Grail Daily Backtest v1.0.1
on:
  pull_request:
    paths:
      - 'holy_grail_backtest_v1.py'
      - 'tests/test_holy_grail_backtest_v1.py'
      - '.github/workflows/holy_grail_backtest_v1.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: holy-grail-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy yfinance
      - name: Compile and test
        run: |
          python -m py_compile holy_grail_backtest_v1.py tests/test_holy_grail_backtest_v1.py
          python -m unittest discover -s tests -p 'test_holy_grail_backtest_v1.py' -v
      - name: Run historical backtest
        run: python holy_grail_backtest_v1.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: linda-holy-grail-daily-v1
          path: output/holy_grail_v1/
          if-no-files-found: error
          retention-days: 30
